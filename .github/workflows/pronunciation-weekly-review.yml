name: Pronunciation Weekly Review

on:
  schedule:
    # 6:00 PM KST on Friday = 09:00 UTC on Friday
    - cron: '0 9 * * 5'
  workflow_dispatch:

concurrency:
  group: pronunciation-weekly-review
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Run pronunciation weekly review bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pronunciation_weekly_review.py
