name: Pronunciation Morning Bot

on:
  schedule:
    # 7:00 AM KST = 22:00 UTC (previous day)
    - cron: '0 22 * * *'
  workflow_dispatch:

concurrency:
  group: pronunciation-morning
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Debug - Check environment variables
        env:
          PRONUNCIATION_BOT_TOKEN: ${{ secrets.PRONUNCIATION_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "PRONUNCIATION_BOT_TOKEN length: ${#PRONUNCIATION_BOT_TOKEN}"
          echo "TELEGRAM_CHAT_ID length: ${#TELEGRAM_CHAT_ID}"
          if [ -z "$PRONUNCIATION_BOT_TOKEN" ]; then echo "ERROR: PRONUNCIATION_BOT_TOKEN is empty"; fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then echo "ERROR: TELEGRAM_CHAT_ID is empty"; fi

      - name: Run pronunciation morning bot
        env:
          PRONUNCIATION_BOT_TOKEN: ${{ secrets.PRONUNCIATION_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pronunciation_morning_bot.py
