name: Pronunciation Evening Bot

on:
  schedule:
    # 6:00 PM KST = 09:00 UTC (매일)
    - cron: '0 9 * * *'
  workflow_dispatch:

concurrency:
  group: pronunciation-evening
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run pronunciation evening bot
        env:
          PRONUNCIATION_BOT_TOKEN: ${{ secrets.PRONUNCIATION_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pronunciation_evening_check.py

      - name: Save feedback to repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add 발음피드백.md 발음읽음기록.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update pronunciation feedback"
          git pull --rebase origin main
          git push
